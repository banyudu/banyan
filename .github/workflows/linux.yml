name: Linux

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-22.04

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Swift
        uses: swift-actions/setup-swift@364295d9c23900ce04d4e5cc708387921b4e50f9
        with:
          swift-version: "6.3.3"

      - name: Install TUI runtime dependency
        run: sudo apt-get update && sudo apt-get install --yes tmux

      - name: Run portable tests
        run: swift test

      - name: Build Linux TUI
        run: swift build --product BanyanTUI

      - name: Smoke test TUI startup and quit
        run: printf 'q' | swift run BanyanTUI
